server.port=8081 
spring.application.name=ms-consultas

# Configuración de Base de Datos MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/db_consultas?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Registro en Eureka (Opcional si ya agregaste la dependencia)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/